<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>로그인</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e9f2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo-section {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo-icon {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, #1a73e8, #4dabf7);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            box-shadow: 0 4px 12px rgba(26, 115, 232, 0.3);
        }

        .logo-icon svg {
            width: 28px;
            height: 28px;
            fill: #ffffff;
        }

        .logo-section h1 {
            font-size: 20px;
            color: #202124;
            font-weight: 600;
        }

        .logo-section p {
            font-size: 13px;
            color: #5f6368;
            margin-top: 4px;
        }

        .login-card {
            width: 420px;
            padding: 40px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08), 0 1px 2px rgba(0, 0, 0, 0.04);
        }

        .provider-badge {
            text-align: center;
            font-size: 11px;
            color: #1a73e8;
            background: #e8f0fe;
            padding: 6px 16px;
            border-radius: 20px;
            margin-bottom: 24px;
            display: inline-block;
            width: 100%;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        .login-card h2 {
            text-align: center;
            color: #202124;
            font-size: 22px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .login-subtitle {
            text-align: center;
            color: #5f6368;
            font-size: 14px;
            margin-bottom: 28px;
        }

        .divider {
            height: 1px;
            background: #e8eaed;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            color: #5f6368;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 1.5px solid #dadce0;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            transition: all 0.2s;
            background: #fafafa;
        }

        .form-group input:focus {
            border-color: #1a73e8;
            box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.12);
            background: #ffffff;
        }

        .form-group input::placeholder {
            color: #bdc1c6;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #1a73e8, #1567d3);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 12px;
            letter-spacing: 0.3px;
        }

        .login-btn:hover {
            background: linear-gradient(135deg, #1567d3, #1257b0);
            box-shadow: 0 4px 12px rgba(26, 115, 232, 0.3);
            transform: translateY(-1px);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .message-error {
            background: #fce8e6;
            color: #c5221f;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 20px;
            text-align: center;
            border-left: 3px solid #c5221f;
        }

        .message-success {
            background: #e6f4ea;
            color: #137333;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 20px;
            text-align: center;
            border-left: 3px solid #137333;
        }

        .footer {
            text-align: center;
            margin-top: 24px;
            font-size: 12px;
            color: #9aa0a6;
        }
    </style>
</head>
<body>

<div class="login-wrapper">
    <div class="logo-section">
        <div class="logo-icon">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zM12 17c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zM15.1 8H8.9V6c0-1.71 1.39-3.1 3.1-3.1s3.1 1.39 3.1 3.1v2z"/>
            </svg>
        </div>
        <h1>OAuth Authorization Server</h1>
    </div>

    <div class="login-card">
        <h2>로그인</h2>
        <p class="login-subtitle">계정 정보를 입력하세요</p>

        <div class="divider"></div>

        <div th:if="${param.error}" class="message-error">
            아이디 또는 비밀번호가 잘못되었습니다.
        </div>

        <div th:if="${param.logout}" class="message-success">
            로그아웃되었습니다.
        </div>

        <div th:if="${param.denied}" class="message-error">
            관리자 계정으로만 접근할 수 있습니다.
        </div>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label>아이디</label>
                <input type="text" name="username" placeholder="아이디를 입력하세요" autocomplete="username" />
            </div>
            <div class="form-group">
                <label>비밀번호</label>
                <input type="password" name="password" placeholder="비밀번호를 입력하세요" autocomplete="current-password" />
            </div>
            <button type="submit" class="login-btn">로그인</button>
        </form>
    </div>

</div>

</body>
</html>
